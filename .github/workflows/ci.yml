name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # package.json has no "packageManager" field, so pin pnpm here.
      # pnpm-lock.yaml is lockfileVersion 9.0.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --if-present must come before the script name with pnpm;
      # after it, the flag is forwarded to the script instead.
      - name: Lint
        run: pnpm run --if-present lint

      - name: Build
        run: pnpm run build
