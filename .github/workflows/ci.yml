name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # package.json has no "packageManager" field, so pin pnpm here.
      # pnpm-lock.yaml is lockfileVersion 9.0.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --if-present must come before the script name with pnpm;
      # after it, the flag is forwarded to the script instead.
      - name: Lint
        run: pnpm run --if-present lint

      - name: Build
        run: pnpm run build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # vercel build runs the project's install/build, which needs pnpm.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Pull Vercel environment
        run: npx vercel@65.2.0 pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: npx vercel@65.2.0 build --prod --token=$VERCEL_TOKEN

      - name: Deploy to production
        run: npx vercel@65.2.0 deploy --prebuilt --prod --token=$VERCEL_TOKEN
